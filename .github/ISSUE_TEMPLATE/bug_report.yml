name: 问题反馈 / Bug report
description: 使用 MOOD 时遇到了错误、卡顿或异常行为
title: "[Bug] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        谢谢你帮助 MOOD 变得更好。请不要在公开 Issue 中填写 API Key、私人对话或其他隐私资料。
  - type: dropdown
    id: platform
    attributes:
      label: 使用平台
      options:
        - Windows x64
        - macOS Apple Silicon
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MOOD 版本
      placeholder: 例如 v1.0.0 Beta
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 请描述你当时在做什么，以及实际看到了什么。
      placeholder: 我在……时，MOOD 出现了……
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 如何复现？
      description: 如果可以重复出现，请按顺序写下操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可以添加已隐藏个人信息的截图或错误提示。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经移除 API Key、个人对话和其他隐私资料。
          required: true
